# vim:fileencoding=utf-8:foldmethod=marker

# Gruvbox Material Dark Medium
# Primary: green
# Secondary: yellow/orange
# Error: red
# Info: blue/cyan

# : Manager {{{

[mgr]
cwd = { fg = "#89b482" }

# Find
find_keyword  = { fg = "#a9b665", bold = true, italic = true, underline = true }
find_position = { fg = "#d8a657", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { fg = "#928374", italic = true }

# Marker
marker_copied   = { fg = "#89b482", bg = "#89b482" }
marker_cut      = { fg = "#ea6962", bg = "#ea6962" }
marker_marked   = { fg = "#7daea3", bg = "#7daea3" }
marker_selected = { fg = "#d4be98", bg = "#d4be98" }

# Count
count_copied   = { fg = "#282828", bg = "#89b482", bold = true }
count_cut      = { fg = "#282828", bg = "#ea6962", bold = true }
count_selected = { fg = "#282828", bg = "#d4be98", bold = true }

# Border
border_symbol = "│"
border_style  = { fg = "#665c54" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#282828", bg = "#89b482", bold = true }
inactive = { fg = "#d4be98", bg = "#3a3632" }

# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#282828", bg = "#89b482", bold = true }
normal_alt  = { fg = "#89b482", bg = "#3a3632" }

# Select mode
select_main = { fg = "#282828", bg = "#d8a657", bold = true }
select_alt  = { fg = "#d8a657", bg = "#3a3632" }

# Unset mode
unset_main = { fg = "#282828", bg = "#ea6962", bold = true }
unset_alt  = { fg = "#ea6962", bg = "#3a3632" }

# : }}}


# : Indicator of hovered file {{{

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }

padding = { open = "█", close = "█" }

# : }}}


# : Status {{{

[status]
overall = { fg = "#d4be98", bg = "#3a3632" }

sep_left  = { open = "\ue0be", close = "\ue0b8" }
sep_right = { open = "\ue0be", close = "\ue0b8" }

# Permissions
perm_sep   = { fg = "#665c54" }
perm_type  = { fg = "#7daea3" }
perm_read  = { fg = "#a9b665" }
perm_write = { fg = "#ea6962" }
perm_exec  = { fg = "#89b482" }

# Progress
progress_label  = { fg = "#d4be98", bold = true }
progress_normal = { fg = "#282828", bg = "#89b482", bold = true }
progress_error  = { fg = "#d4be98", bg = "#ea6962", bold = true }

# : }}}


# : Which {{{

[which]
cols            = 3
mask            = { bg = "#282828" }
cand            = { fg = "#89b482", bold = true }
rest            = { fg = "#928374" }
desc            = { fg = "#d8a657" }

separator       = "  "
separator_style = { fg = "#665c54" }

# : }}}


# : Confirmation {{{

[confirm]
border     = { fg = "#89b482" }
title      = { fg = "#89b482", bold = true }
body       = { fg = "#d4be98" }
list       = { fg = "#d4be98" }

btn_yes    = { fg = "#282828", bg = "#89b482", bold = true }
btn_no     = { fg = "#d4be98", bg = "#3a3632" }

btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#89b482" }
title  = { fg = "#89b482", bold = true }

# Table
tbl_col  = { fg = "#7daea3", bold = true }
tbl_cell = { fg = "#282828", bg = "#d8a657", bold = true }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#89b482", bold = true }
title_warn  = { fg = "#d8a657", bold = true }
title_error = { fg = "#ea6962", bold = true }

# : }}}


# : Picker {{{

[pick]
border   = { fg = "#7daea3" }
active   = { fg = "#282828", bg = "#d3869b", bold = true }
inactive = { fg = "#d4be98" }

# : }}}


# : Input {{{

[input]
border   = { fg = "#a89984" }
title    = { fg = "#d8a657", bold = true }
value    = { fg = "#d4be98" }
selected = { fg = "#282828", bg = "#d4be98" }

# : }}}


# : Completion {{{

[cmp]
border   = { fg = "#665c54" }
active   = { reversed = true, fg = "#89b482" }
inactive = { fg = "#d4be98" }

# : }}}


# : Task manager {{{

[tasks]
border  = { fg = "#665c54" }
title   = { fg = "#d8a657", bold = true }
hovered = { fg = "#282828", bg = "#89b482", bold = true }

# : }}}


# : Help {{{

[help]
on      = { fg = "#89b482", bold = true }
run     = { fg = "#d3869b" }
desc    = { fg = "#d4be98" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#282828", bg = "#89b482" }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#d3869b" },

  # Media
  { mime = "{audio,video}/*", fg = "#d8a657" },

  # Archives
  { mime = "application/*zip", fg = "#ea6962" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#ea6962" },

  # Documents
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#89b482" },

  # Broken / unusual files
  { url = "*", is = "orphan", fg = "#ea6962" },

  # Executables
  { url = "*", is = "exec", fg = "#a9b665" },

  # Fallback
  { url = "*", fg = "#d4be98" },
  { url = "*/", fg = "#7daea3" },
]

# : }}}
